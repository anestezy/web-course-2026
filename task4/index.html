<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №4. Быки и коровы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Игра «Быки и коровы»</h1>
    <p>Компьютер загадал число из 4 разных цифр. Угадайте его.</p>

    <div>
        <input type="text" id="guessInput" placeholder="Введите 4 цифры">
        <button id="checkBtn">Проверить</button>
        <button id="newGameBtn">Новая игра</button>
    </div>

    <p id="message"></p>
    <p>Попыток: <span id="counter">0</span></p>

    <h2>История попыток</h2>
    <ul id="history"></ul>

    <script src="script.js"></script>
</body>
</html>
