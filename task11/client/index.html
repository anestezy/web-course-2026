<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen-Money — лабораторная 10-11</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Zen-Money</h1>
    <button type="button" id="theme-toggle"></button>
  </header>

  <main class="container">
    <section id="status" class="status hidden"></section>

    <section class="summary">
      <div class="summary-card"><span>Доходы</span><strong id="summary-income" class="income">0.00</strong></div>
      <div class="summary-card"><span>Расходы</span><strong id="summary-expense" class="expense">0.00</strong></div>
      <div class="summary-card"><span>Баланс</span><strong id="summary-balance">0.00</strong></div>
    </section>

    <section class="block">
      <h2>Фильтры</h2>
      <div class="row">
        <label>Категория<select id="filter-category"></select></label>
        <label>Тип
          <select id="filter-type">
            <option value="">Любой</option>
            <option value="income">Доходы</option>
            <option value="expense">Расходы</option>
          </select>
        </label>
        <label>С<input type="date" id="filter-from"></label>
        <label>По<input type="date" id="filter-to"></label>
        <button type="button" id="filters-apply">Применить</button>
        <button type="button" id="filters-reset" class="secondary">Сбросить</button>
      </div>
    </section>

    <section class="block">
      <h2 id="transaction-form-title">Добавить операцию</h2>
      <form id="transaction-form" class="row" novalidate>
        <label>Сумма<input type="number" id="field-amount" step="0.01" min="0.01" placeholder="0.00"></label>
        <label>Тип
          <select id="field-type">
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </label>
        <label>Категория<select id="field-category"></select></label>
        <label>Дата<input type="date" id="field-date"></label>
        <label>Комментарий<input type="text" id="field-comment" maxlength="120" placeholder="необязательно"></label>
        <button type="submit" id="transaction-submit">Добавить</button>
        <button type="button" id="transaction-cancel" class="secondary hidden">Отмена</button>
      </form>
    </section>

    <section class="block">
      <h2>Новая категория</h2>
      <form id="category-form" class="row" novalidate>
        <label>Название<input type="text" id="category-name" maxlength="40" placeholder="Например, Транспорт"></label>
        <label>Тип
          <select id="category-type">
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </label>
        <button type="submit">Создать</button>
      </form>
    </section>

    <section class="block">
      <h2>Операции</h2>
      <table class="transactions">
        <thead>
          <tr><th>Дата</th><th>Категория</th><th>Комментарий</th><th>Сумма</th><th></th></tr>
        </thead>
        <tbody id="transactions-body"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
